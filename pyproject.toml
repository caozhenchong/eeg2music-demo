[project]
name = "eeg2music-demo"
version = "0.1.0"
description = "Standalone EEG-to-music desktop demonstration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "mne>=1.0",
    "matplotlib>=3.4",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
